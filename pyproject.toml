[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_grokbot"
version = "0.1.0"
description = "Reachy Mini body for a Grok Bot chief of staff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "mcp>=1.8",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."reachy_mini_apps"]
reachy_mini_grokbot = "reachy_mini_grokbot.main:ReachyMiniGrokbot"

[project.scripts]
reachy-mini-grokbot = "reachy_mini_grokbot.main:launch"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_mini_grokbot*"]

[tool.setuptools.package-data]
reachy_mini_grokbot = ["**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
